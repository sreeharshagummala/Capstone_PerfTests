apiVersion: apps/v1
kind: Deployment
metadata:
  name: shopsphere-api-gateway
  labels:
    app: api-gateway
spec:
  replicas: 3
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: shopsphere/api-gateway:1.0
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: shopsphere-product-service
  labels:
    app: product-service
spec:
  replicas: 3
  selector:
    matchLabels:
      app: product-service
  template:
    metadata:
      labels:
        app: product-service
    spec:
      containers:
        - name: product-service
          image: shopsphere/product-service:1.0
          ports:
            - containerPort: 8081
          resources:
            requests:
              cpu: "700m"
              memory: "1Gi"
            limits:
              cpu: "1500m"
              memory: "2Gi"

---

